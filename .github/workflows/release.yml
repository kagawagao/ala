name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.3.0). Required when not triggered from a tag.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install dependencies
        run: npm run install:all

      - name: Run lint and tests
        run: npm run lint && npm test

  docker-release:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ -n "$V" && "$V" != v* ]]; then V="v$V"; fi
          echo "tag=${V:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${INPUT_VERSION:-$TAG_VERSION}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest

  desktop-packages:
    name: Build Desktop Packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset_suffix: macos
          - os: windows-latest
            asset_suffix: windows-x64

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ -n "$V" && "$V" != v* ]]; then V="v$V"; fi
          echo "tag=${V:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Install backend dependencies
        run: cd backend && poetry install --no-interaction --no-ansi

      - name: Build standalone executable
        run: cd backend && poetry run pyinstaller ala.spec --noconfirm

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${INPUT_VERSION:-$TAG_VERSION}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Package macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/package-macos.sh --version "${{ steps.version.outputs.version }}" --output-dir release-assets

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version "${{ steps.version.outputs.version }}" -OutputDir release-assets

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-package-${{ matrix.asset_suffix }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - docker-release
      - desktop-packages
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: write
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ -n "$V" && "$V" != v* ]]; then V="v$V"; fi
          echo "name=${V:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4.1.3
        with:
          pattern: desktop-package-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, 'alpha') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'rc') }}
          files: release-assets/*
