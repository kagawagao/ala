name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v2.3.0). Required when not triggered from a tag.'
        required: false
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  MACOS_MIN_VERSION: '12.0'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: pip install poetry==2.3.2

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Frontend lint & type-check
        run: npm run lint && npm run test:frontend

      - name: Backend install & test
        working-directory: backend
        run: |
          poetry install --no-interaction --no-ansi
          poetry run ruff check src/
          poetry run pytest tests/ -v

  docker-release:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve release ref
        id: ref
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ -n "$V" && "$V" != v* ]]; then V="v$V"; fi
          echo "tag=${V:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          VERSION="${INPUT_VERSION:-$TAG_VERSION}"
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.BACKEND_IMAGE }}:latest

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.FRONTEND_IMAGE }}:latest

  publish-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - docker-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    permissions:
      actions: read
      contents: write
    steps:
      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          V="${{ inputs.version }}"
          if [[ -n "$V" && "$V" != v* ]]; then V="v$V"; fi
          echo "name=${V:-$GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Resolve Build workflow run
        id: build-run
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const tag = `${{ steps.tag.outputs.name }}`

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRuns,
              {
                owner,
                repo,
                workflow_id: 'build.yml',
                per_page: 100,
              },
            )

            const matched = runs
              .filter((r) => r.conclusion === 'success' && r.head_branch === tag)
              .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0]

            if (!matched) {
              core.setFailed(`No successful Build workflow run found for tag ${tag}.`)
              return
            }

            core.info(`Using Build run ${matched.id} for tag ${tag}`)
            core.setOutput('id', String(matched.id))

      - name: Download packaged artifacts from Build workflow
        uses: actions/download-artifact@v4.1.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.build-run.outputs.id }}
          pattern: desktop-package-*
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, 'alpha') || contains(steps.tag.outputs.name, 'beta') || contains(steps.tag.outputs.name, 'rc') }}
          files: release-assets/*
