name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
        default: patch
      preid:
        description: 'Pre-release identifier (e.g. alpha, beta, rc) — only used for pre* types'
        required: false
        default: ''

jobs:
  bump-version:
    name: Bump Version Across All Files
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          if [ -n "${{ inputs.preid }}" ]; then
            NEW_VERSION=$(npm version ${{ inputs.version_type }} --preid=${{ inputs.preid }} --no-git-tag-version)
          else
            NEW_VERSION=$(npm version ${{ inputs.version_type }} --no-git-tag-version)
          fi
          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"

          # Strip leading 'v' for bare version number
          VERSION_NUM="${NEW_VERSION#v}"

          # 1. Root package.json (already done by npm version above)
          # 2. Frontend package.json
          cd frontend && npm version "$VERSION_NUM" --no-git-tag-version && cd ..

          # 3. Backend pyproject.toml (Poetry)
          sed -i "s/^version = \".*\"/version = \"$VERSION_NUM\"/" backend/pyproject.toml

          # 4. Backend FastAPI app (main.py) — version string
          sed -i "s/version=\"[^\"]*\"/version=\"$VERSION_NUM\"/" backend/src/ala/main.py

          # 5. Backend health endpoint (health.py) — version string
          sed -i "s/version=\"[^\"]*\"/version=\"$VERSION_NUM\"/" backend/src/ala/api/health.py

      - name: Commit and tag
        run: |
          git add \
            package.json package-lock.json \
            frontend/package.json frontend/package-lock.json \
            backend/pyproject.toml \
            backend/src/ala/main.py \
            backend/src/ala/api/health.py
          HUSKY=0 git commit -m "chore(release): ${{ steps.bump.outputs.new_version }}"
          git tag ${{ steps.bump.outputs.new_version }}

      - name: Push changes and tag
        run: git push origin HEAD ${{ steps.bump.outputs.new_version }}
